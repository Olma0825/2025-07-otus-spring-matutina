spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: never
  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: none
        #format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG