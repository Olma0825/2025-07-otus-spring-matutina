<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Онлайн библиотека</title>
</head>
<body>

<div th:replace="~{fragments :: navbar(activePage='genres')}"></div>

<h1>Жанры</h1>
<table class="books-table">
    <thead>
    <tr>
        <th>№</th>
        <th>Название</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="genre : ${genres}">
        <td th:text="${genre.id}">1</td>
        <td th:text="${genre.name}">Лев Толстой</td>
    </tr>

    </tbody>
</table>

</body>
</html>
