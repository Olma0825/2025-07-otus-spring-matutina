<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Добавление книги</title>
</head>
<body>
<div class="form-container">
    <h2 th:if="${isEdit}">Редактирование книги</h2>
    <h2 th:if="${!isEdit}">Добавление новой книги</h2>

    <form th:action="@{/book/save}" th:object="${book}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="form-group">
            <label for="title">Название:</label>
            <input type="text" id="title" th:field="*{title}" required/>
        </div>

        <div class="form-group">
            <label for="author">Автор:</label>
            <select id="author" name="authorId" th:value="${book.authorId}" required>
                <option value="">-- Выберите автора --</option>
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.fullName}"
                        th:selected="${isEdit && book.authorId == author.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="genre">Жанр:</label>
            <select id="genre" name="genreId" th:value="${book.genreId}" required>
                <option value="">-- Выберите жанр --</option>
                <option th:each="genre : ${genres}"
                        th:value="${genre.id}"
                        th:text="${genre.name}"
                        th:selected="${isEdit && book.genreId == genre.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <button type="submit" class="btn-submit">Сохранить</button>
            <a th:href="@{/}"><button type="button" class="btn-cancel">Отмена</button></a>
        </div>
    </form>
</div>
</body>
</html>
