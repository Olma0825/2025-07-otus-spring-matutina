server:
  port: 8080

spring:
  application:
    name: main-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tutortrack?currentSchema=main_schema
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: main_schema
    locations:
      - classpath:db/migration/postgresql

  data:
    mongodb:
      host: localhost
      port: 27017
      database: tutortrack
      authentication-database: admin
      username: admin
      password: adminpass

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

auth:
  service:
    url: http://localhost:8081

logging:
  level:
    com.tutortrack: DEBUG
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG