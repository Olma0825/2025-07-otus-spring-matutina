server:
  port: 8080

spring:
  application:
    name: main-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tutortrack
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    mongodb:
      host: localhost
      port: 27017
      database: tutortrack
      authentication-database: admin
      username: admin
      password: adminpass

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

auth:
  service:
    url: http://localhost:8081

# Логирование
logging:
  level:
    com.tutortrack: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
