<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TutorTrack - Авторизация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .tab {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab button {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
        }
        .tab button.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background: #5a67d8;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .info {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>TutorTrack</h1>

    <div class="tab">
        <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
        <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div id="login-form" class="form active">
        <h3>Вход в систему</h3>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="login-message" class="message"></div>
    </div>

    <div id="register-form" class="form">
        <h3>Регистрация</h3>
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Пароль (min 6 символов)">
        <input type="text" id="reg-name" placeholder="Имя">
        <input type="text" id="reg-phone" placeholder="Телефон">
        <button onclick="register()">Зарегистрироваться</button>
        <div id="register-message" class="message"></div>
    </div>

    <div class="info">
        После входа вы будете перенаправлены на страницу управления студентами
    </div>
</div>

<script>
    function switchTab(tab) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const btns = document.querySelectorAll('.tab-btn');

        if (tab === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
        } else {
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
            btns[0].classList.remove('active');
            btns[1].classList.add('active');
        }
    }

    async function register() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;

        const msgDiv = document.getElementById('register-message');
        msgDiv.className = 'message';

        try {
            const response = await fetch('http://localhost:8081/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name, phone })
            });

            if (response.status === 201) {
                msgDiv.textContent = 'Регистрация успешна! Теперь войдите.';
                msgDiv.classList.add('success');
                setTimeout(() => switchTab('login'), 1500);
            } else {
                const error = await response.text();
                msgDiv.textContent = 'Ошибка: ' + (error || 'Не удалось зарегистрироваться');
                msgDiv.classList.add('error');
            }
        } catch (err) {
            msgDiv.textContent = 'Ошибка: ' + err.message;
            msgDiv.classList.add('error');
        }
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const msgDiv = document.getElementById('login-message');
        msgDiv.className = 'message';

        try {
            const response = await fetch('http://localhost:8081/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.status === 200) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('role', data.role);

                if (data.role === 'TEACHER') {
                    window.location.href = '/students';
                } else {
                    window.location.href = '/ratings';
                }
            } else {
                msgDiv.textContent = 'Неверный email или пароль';
                msgDiv.classList.add('error');
            }
        } catch (err) {
            msgDiv.textContent = 'Ошибка: ' + err.message;
            msgDiv.classList.add('error');
        }
    }
</script>
</body>
</html>
